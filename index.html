<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SYNERO | קטלוג מוצרים</title>

  <!-- Font (optional) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg1:#0c1830;
      --bg2:#182a4d;
      --bg3:#1f3a63;
      --card:#243a62cc;
      --card2:#2a4572cc;
      --stroke:#3b5b8e80;
      --text:#eaf1ff;
      --muted:#b7c7e6;
      --accent:#62c5d6;
      --accent2:#7a5cff;
      --btn:#69a9ff;
      --shadow: 0 20px 60px rgba(0,0,0,.35);
      --radius: 22px;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: "Heebo", system-ui, -apple-system, Segoe UI, Arial, sans-serif;
      color:var(--text);
      background:
        radial-gradient(1200px 600px at 20% 10%, #2a4b8a55, transparent 60%),
        radial-gradient(900px 500px at 80% 30%, #3a6fb255, transparent 55%),
        radial-gradient(900px 700px at 50% 90%, #1aa6b755, transparent 60%),
        linear-gradient(145deg, var(--bg1), var(--bg2) 45%, var(--bg3));
      background-attachment: fixed;
      background-repeat: no-repeat;
      overflow-x:hidden;
    }

    /* subtle network lines */
    .mesh{
      position:fixed; inset:0;
      pointer-events:none;
      opacity:.22;
      background-image:
        linear-gradient(to right, rgba(120,170,255,.15) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(120,170,255,.15) 1px, transparent 1px);
      background-size: 90px 90px;
      mask-image: radial-gradient(600px 320px at 50% 20%, black 30%, transparent 70%);
      filter: blur(.2px);
    }

    /* Top bar */
    .topbar{
      position:sticky; top:0; z-index:50;
      backdrop-filter: blur(10px);
      background: linear-gradient(90deg, rgba(8, 13, 24, 0.78), rgba(30,52,88,.62));
      border-bottom:1px solid rgba(255,255,255,.06);
    }
    .topbar-inner{
      max-width:1200px;
      margin:0 auto;
      padding:16px 18px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
    }
    .topbar-inner .nav{
      flex:1;
      justify-content:center;
    }
    .brand{
      display:flex; align-items:center; gap:10px;
      user-select:none;
    }
    .logo{
      width:300px; height:90px;
      border-radius:8px;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      background-image: url('https://egud.org.il/wp-content/uploads/2025/11/SNR-לבן.png');
      position:relative;
      overflow:hidden;
    }
    .logo:after{
      display:none;
    }

    .brand h1{
      margin:0;
      font-size:20px;
      letter-spacing:.3px;
      font-weight:800;
      line-height:1.1;
    }
    .brand small{
      display:block;
      color:var(--muted);
      font-weight:500;
      margin-top:2px;
      font-size:12px;
    }

    .nav{
      display:flex; gap:14px; align-items:center; flex-wrap:wrap;
      justify-content:center;
      color:white;
      font-weight:100;
      font-size:20px;
      text-align: center;
    }
    .nav a{
      color:inherit; text-decoration:none;
      padding:8px 10px;
      border-radius:12px;
      transition:.2s ease;
    }
    .nav a:hover{
      color:var(--btn)
    }

    .search{
      width:280px;
      max-width:35vw;
      padding:8px 12px;
      border-radius:10px;
      border:1px solid rgba(255,255,255,.06);
      background: rgba(255,255,255,.03);
      color:var(--text);
      font-size:14px;
      outline:none;
      direction: rtl;
      text-align: right;
      transition: box-shadow .12s ease, border-color .12s ease;
      font-family: "Heebo", sans-serif;
      height:40px;
      display:flex;
      align-items:center;
    }
    .search:focus{ box-shadow: 0 6px 18px rgba(0,0,0,.35); border-color: rgba(98,197,214,.35); }
    .search::placeholder{ color: rgba(234,241,255,.35); }

    .cta{
      display:flex; align-items:center; gap:10px;
      height:40px;
    }
    .btn{
      appearance:none;
      border:0;
      background: linear-gradient(145deg, rgba(105,169,255,.95), rgba(105,169,255,.70));
      color:#fafafb;
      font-weight:400;
      padding:10px 16px;
      border-radius:999px;
      font-size: 18px;
      cursor:pointer;
      box-shadow: 0 14px 35px rgba(105,169,255,.25);
      transition: transform .18s ease, box-shadow .18s ease;
      white-space:nowrap;
    }
    .btn:hover{ transform: translateY(-1px); box-shadow: 0 18px 45px rgba(105,169,255,.32); }
    .btn:active{ transform: translateY(0px) scale(.99); }
    
    .btn-outline{
      background: rgba(84, 137, 212, 1) !important;
      border: 1.5px solid rgba(87, 140, 213, 1) !important;
        color: #ffffff !important;
      box-shadow: none !important;
      font-weight:400 !important;

    }
    .btn-outline:hover{
        background: rgba(98,197,214,.08) !important;
      border-color: rgba(87, 140, 213, 1) !important;
      box-shadow: 0 8px 20px rgba(98,197,214,.15) !important;
    }

    /* Hero */
    .wrap{
      max-width:1200px;
      margin:0 auto;
      padding:48px 18px 80px;
    }
    .hero{
      display:block;
      text-align:center;
      margin-bottom:40px;
    }
    .hero-hand{
      display:none;
    }
    .hand-wave{
      display:none;
    }
    .hero h2{
      margin:0 0 10px;
      font-size:32px;
      font-weight:900;
      letter-spacing:0;
      line-height:1.2;
      color: var(--text);
    }
    .hero p{
      margin:0;
      color:var(--muted);
      line-height:1.6;
      font-weight:400;
      font-size: 18px;
    }
    .pill-row{
      display:none;
    }
    .pill{
      font-size:14px;
      padding:10px 14px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(98,197,214,.10);
      color:var(--accent);
      font-weight: 500;
    }

    /* Catalog grid */
    .section-title{
      margin:0 0 20px;
      font-size:25px;
      color:var(--text);
      font-weight:900;
      letter-spacing:0;
      text-align:left;
    }

    .grid{
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap:16px;
    }
    @media (max-width: 1020px){
      .grid{ grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 650px){
      .grid{ grid-template-columns: 1fr; }
    }

    .card{
      position:relative;
      border-radius: 16px;
      padding:24px;
      background: linear-gradient(135deg, rgba(25,40,70,.6) 0%, rgba(40,60,100,.4) 100%);
      border:2px solid rgba(98,197,214,.35);
      box-shadow: 0 8px 24px rgba(0,0,0,.20);
      overflow:hidden;
      transition: all .25s ease;
      min-height: 280px;
      display:flex;
      flex-direction:column;
      gap:16px;
      cursor:pointer;
    }
    .card:hover{
      transform: translateY(-5px);
      border-color: rgba(98,197,214,.60);
      box-shadow: 0 16px 40px rgba(0,0,0,.30), inset 0 1px 0 rgba(98,197,214,.10);
      background: linear-gradient(135deg, rgba(25,50,90,.8) 0%, rgba(40,70,120,.5) 100%);
    }
    .card:before{
      display:none;
    }
    .card.no-image{
      width: fit-content;
      margin: 0 auto;
    }

    /* Product card layout */
    .card-media{
      width:100%;
      height:140px;
      border-radius:12px;
      overflow:hidden;
      background: linear-gradient(135deg, rgba(18,34,58,.25), rgba(30,50,80,.18));
      display:flex; align-items:center; justify-content:center;
      margin-bottom:12px;
    }
    .card-media img{ width:100%; height:100%; object-fit:cover; display:block; }
    .card-body{ display:flex; flex-direction:column; gap:10px; }
    .tags-row{ display:flex; gap:8px; flex-wrap:wrap; margin-top:6px; }
    .card-bottom{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:8px; }
    .price-chip{ font-weight:900; color:var(--bg1); background:var(--accent); padding:8px 12px; border-radius:999px; font-family: "Heebo", sans-serif; }

    .icon{
      width:56px; height:56px;
      border-radius:12px;
      background: linear-gradient(135deg, rgba(98,197,214,.12) 0%, rgba(122,92,255,.08) 100%);
      border:1px solid rgba(98,197,214,.20);
      display:grid;
      place-items:center;
      position:relative;
      z-index:1;
    }
    .icon svg{ width:24px; height:24px; opacity:1; color: var(--accent); fill: currentColor; }

    .card h3{
      margin:0;
      font-size:19px;
      font-weight:800;
      position:relative;
      z-index:1;
      line-height:1.4;
      color: var(--accent);
      text-align:start;
      font-family: "Heebo", sans-serif;
    }
    .card p{
      margin:0;
      color:var(--muted);
      line-height:1.7;
      font-size:14px;
      font-family: "Heebo", sans-serif;
      position:relative;
      z-index:1;
      flex:1;
      text-align:start;
    }
    .meta{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      align-items:center;
      justify-content:space-between;
      position:relative;
      z-index:1;
      margin-top:12px;
    }
    .price{
      font-weight:600;
      color: var(--accent);
      font-size:12px;
    }
    .link{
      background: rgba(98,197,214,.10);
      border:1px solid rgba(98,197,214,.20);
      color: var(--accent);
      padding:8px 12px;
      border-radius: 8px;
      cursor:pointer;
      font-weight:600;
      font-size:12px;
      transition:.15s ease;
    }
    .link:hover{ background: rgba(98,197,214,.18); }

    /* Modal */
    .modal-backdrop{
      position:fixed; inset:0;
      background: rgba(0,0,0,.55);
      backdrop-filter: blur(6px);
      display:none;
      align-items:center;
      justify-content:center;
      padding:18px;
      z-index:100;
    }
    .modal-backdrop.show{ display:flex; }
    .modal{
      width:min(980px, 100%);
      max-height:90vh;
      border-radius: 26px;
      background: linear-gradient(160deg, rgba(24,42,77,.92), rgba(12,24,48,.92));
      border: 1px solid rgba(255,255,255,.10);
      box-shadow: 0 30px 100px rgba(0,0,0,.55);
      overflow:hidden;
      position:relative;
      display:flex;
      flex-direction:column;
    }
    .modal-header{
      padding:18px 18px 14px;
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:10px;
      border-bottom:1px solid rgba(255,255,255,.08);
    }
    .modal-title{
      display:flex;
      gap:12px;
      align-items:center;
    }
    .modal-title h3{
      margin:0;
      font-size:26px;
      font-weight:900;
      font-family: "Heebo", sans-serif;
      letter-spacing:0.3px;
    }
    .modal-title small{
      display:block;
      color:var(--muted);
      margin-top:6px;
      font-weight:500;
      font-size:16px;
      line-height:1.6;
      max-width: 60ch;
      font-family: "Heebo", sans-serif;
    }
    .close{
      border:0;
      background: rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.10);
      color: var(--text);
      width:40px; height:40px;
      border-radius: 14px;
      cursor:pointer;
      font-size:18px;
      font-weight:900;
      display:grid;
      place-items:center;
    }
    .modal-body{
      padding:18px;
      display:flex;
      flex-direction:column;
      gap:16px;
      flex:1;
      overflow-y:auto;
      overflow-x:hidden;
    }
    @media (max-width: 860px){
      .modal-body{ flex-direction:column; }
    }
    .modal-body.has-image{
      flex-direction:column;
    }
    .modal-body > .panel:first-child{
      order:1;
    }
    .modal-body > .image-panel{
      order:2;
    }
    /* modal panels: make flat inside modal (no boxed background) */
    .modal .panel{
      border-radius: 0;
      background: transparent;
      border: none;
      padding:0;
    }
    .panel h4{
      margin:0 0 14px;
      font-size:17px;
      font-weight:900;
      color: rgba(234,241,255,.98);
      letter-spacing:0.5px;
      font-family: "Heebo", sans-serif;
    }
    ul.clean{
      margin:0;
      padding:0 18px 0 0;
      color:var(--muted);
      line-height:2.1;
      font-size:16px;
      font-family: "Heebo", sans-serif;
      font-weight:500;
    }
    .tagrow{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-top:10px;
    }
    .tag{
      font-size:13px;
      padding:8px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.10);
      color: rgba(234,241,255,.92);
      font-weight:700;
      font-family: "Heebo", sans-serif;
    }
    .image-slot{
      width:100%;
      aspect-ratio: 16/9;
      border-radius: 18px;
      border: 1px dashed rgba(255,255,255,.18);
      background:
        radial-gradient(220px 120px at 30% 20%, rgba(98,197,214,.20), transparent 55%),
        radial-gradient(260px 140px at 80% 80%, rgba(122,92,255,.20), transparent 60%),
        rgba(255,255,255,.04);
      display:grid;
      place-items:center;
      color: rgba(234,241,255,.70);
      font-weight:700;
      text-align:center;
      padding:12px;
    }
    .image-slot.hidden{
      display:none;
    }
    .image-panel.hidden{
      display:none;
    }

    mark{ background: rgba(122,92,255,.18); color: var(--text); padding:0 4px; border-radius:4px; }
    .modal-footer{
      display:flex;
      flex-direction:column;
      gap:12px;
      padding:18px 18px 20px;
      border-top:1px solid rgba(255,255,255,.08);
    }
    .modal-footer .price-big{
      align-self:flex-start;
    }
    .modal-footer .btn{ padding:12px 16px; font-size:16px; align-self:center; }
    .copy-link{ color:var(--accent); text-decoration:none; cursor:pointer; font-weight:600; font-size:14px; transition:.12s ease; }
    .copy-link:hover{ text-decoration:underline; opacity:.8; }
    .price-big{
      font-weight:800;
      font-size:18px;
      color: var(--accent);
      background: transparent;
      padding:0;
      border: none;
      font-family: "Heebo", sans-serif;
    }
    .ghost{
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.10);
      color: var(--text);
      padding:12px 16px;
      border-radius: 999px;
      cursor:pointer;
      font-weight:900;
      font-size:15px;
      font-family: "Heebo", sans-serif;
    }

    /* Contact form modal */
    .contact-backdrop{ position:fixed; inset:0; display:none; align-items:center; justify-content:center; background: linear-gradient(rgba(3,6,12,.55), rgba(3,6,12,.55)); z-index:120; padding:18px; }
    .contact-backdrop.show{ display:flex; }
    .contact-modal{ width:min(720px,100%); border-radius:24px; background: linear-gradient(180deg, rgba(18,34,58,0.98), rgba(12,24,48,0.98)); padding:20px; border:1px solid rgba(98,197,214,.06); box-shadow: 0 24px 80px rgba(6,12,32,.6); }
    .contact-modal h4{ margin:0 0 8px; font-size:20px; font-weight:900; color:var(--text); }
    .contact-modal p.hint{ margin:6px 0 14px; color:var(--muted); font-size:14px; }
    .form-row{ display:flex; gap:12px; margin-bottom:12px; }
    .form-row .field{ flex:1; display:flex; flex-direction:column; }
    .form-row .field label{ font-size:13px; color:var(--muted); margin-bottom:6px; }
    input.input, textarea.input{ background: rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.06); color:var(--text); padding:12px 14px; border-radius:10px; outline:none; font-family: "Heebo", sans-serif; transition: box-shadow .12s ease, border-color .12s ease; }
    input.input::placeholder, textarea.input::placeholder{ color: rgba(234,241,255,.35); }
    input.input:focus, textarea.input:focus{ box-shadow: 0 8px 26px rgba(98,197,214,.12); border-color: rgba(98,197,214,.45); }
    textarea.input{ min-height:140px; resize:vertical; min-width:100%; }
    .contact-actions{ display:flex; gap:8px; justify-content:flex-end; margin-top:12px; }
    .contact-actions .ghost{ background: transparent; border:1px solid rgba(255,255,255,.08); color:var(--muted); }
    .contact-actions .btn{ min-width:120px; padding:10px 16px; font-size:15px; }
    @media (max-width:600px){ .form-row{ flex-direction:column; } .contact-modal{ padding:14px; } }

    /* Interest small popup (used when user clicks 'זה מעניין אותי') */
    .interest-backdrop{ position:fixed; inset:0; display:none; align-items:center; justify-content:center; background: rgba(3,6,12,.55); z-index:130; padding:18px; }
    .interest-backdrop.show{ display:flex; }
    .interest-modal{ width:min(520px,100%); border-radius:14px; background: linear-gradient(180deg, rgba(24,40,66,.98), rgba(12,22,40,.98)); padding:16px; border:1px solid rgba(98,197,214,.06); box-shadow: 0 18px 60px rgba(6,12,32,.6); }
    .interest-modal h5{ margin:0 0 8px; font-size:17px; font-weight:800; color:var(--text); }
    .interest-modal p.small{ margin:0 0 10px; color:var(--muted); font-size:14px; }
    .interest-row{ display:flex; gap:8px; }
    .interest-row input{ flex:1; }
    @media (max-width:420px){ .interest-modal{ padding:12px; } }

    /* Footer */
    footer{
      max-width:1200px;
      margin:28px auto 30px;
      padding:0 18px;
      color: rgba(234,241,255,.65);
      font-size:14px;
      line-height:1.6;
      font-family: "Heebo", sans-serif;
    }
  </style>
</head>

<body>
  <div class="mesh"></div>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
         <a href="https://sy-nero.com/"><div class="logo" aria-hidden="true"></div></a><br>

      </div>
              <h4>SY-NERO TECH</h4>

      <nav class="nav" aria-label="תפריט">
      </nav>


      <div class="cta">
        <button class="btn" id="contactBtn" type="button">צור קשר</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <div class="hero-hand">
      </div>
    </section>
      <input id="searchInput" class="search" type="search" placeholder="חפש לפי שם או תווית..." aria-label="חיפוש מוצרים" />
<br><br>
    <section class="grid" id="grid" aria-label="קטלוג מוצרים"></section>

  <!-- Modal -->
  <div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-label="פרטי מוצר">
    <div class="modal" role="document">
      <div class="modal-header">
        <div class="modal-title">
          <h3 id="modalName">כותרת</h3>
        </div>
        <button class="close" id="closeModal" type="button" aria-label="סגירה">×</button>
      </div>

      <div class="modal-body">
        <p class="modal-description" id="modalDesc" style="margin:0; color:var(--text); font-size:16px; line-height:1.8; font-family:'Heebo',sans-serif;"></p>

<div class="panel">
  <h4>פירוט מלא</h4>
  <p id="modalIncludes" class="modal-includes"></p>

  <div class="tagrow" id="modalTags"></div>
</div>



        <div class="panel image-panel" id="imagePanel">
          <div class="image-slot" id="imageSlot">
            כאן תוכלי לשים תמונה / גלריה לכל מוצר<br/>
            (בשלב הבא נחליף את זה לתמונות אמיתיות)
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <div class="price-big" id="modalPrice">מחיר: —</div>
        <button class="btn" id="requestBtn" type="button" style="width:fit-content; padding:14px 20px;">זה מעניין אותי</button>
        <a class="copy-link" id="copyBtn" role="button" tabindex="0">← העתק תיאור</a>
      </div>
    </div>
  </div>

  <!-- Contact Modal -->
  <div class="contact-backdrop" id="contactBackdrop" role="dialog" aria-modal="true" aria-label="צור קשר">
    <div class="contact-modal" role="document">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:12px;">
        <h4>צור קשר</h4>
        <button class="close" id="closeContact" type="button" aria-label="סגירה">×</button>
      </div>
      <p class="hint">נשמח לפרטים קצרים — אנו ניצור עמכם קשר במהירות האפשרית.</p>
      <div style="margin-top:6px;">
        <div class="form-row">
          <div class="field">
            <label style="font-size:13px; color:var(--muted); margin-bottom:6px;">שמך</label>
            <input id="contactName" class="input" type="text" placeholder="שמך" />
          </div>
          <div class="field">
            <label style="font-size:13px; color:var(--muted); margin-bottom:6px;">אימייל</label>
            <input id="contactEmail" class="input" type="email" placeholder="your@example.com" />
          </div>
        </div>
        <div style="margin-top:6px;">

    // Render catalog cards
    const grid = document.getElementById('grid');

    function render(list, term = ''){
      const q = String(term || '').trim();
      grid.innerHTML = "";
      list.forEach(p => {
        const el = document.createElement('article');
        el.className = "card" + (p.image ? "" : " no-image");
        el.dataset.id = p.id;
        const highlightText = (text) => {
          if(!q) return escapeHtml(text);
          const esc = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const safe = escapeHtml(text);
          return safe.replace(new RegExp(esc, 'gi'), m => `<mark>${m}</mark>`);
        };
        const nameHtml = highlightText(p.name);
        const shortHtml = highlightText(p.short);
        el.innerHTML = `
          <div class="card-media">
            ${p.image ? `<img src="${p.image}" alt="${escapeHtml(p.name)}">` : `<div class="icon" aria-hidden="true">${p.icon}</div>`}
          </div>
          <div class="card-body">
            <h3 style="margin:0; font-size:18px; line-height:1.2;">${nameHtml}</h3>
            <p style="margin:0; font-size:14px; color:var(--muted); line-height:1.5;">${shortHtml}</p>
            <div class="tags-row">${p.tags.map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>
            <div class="card-bottom">
              <div style="flex:1"></div>
              <button class="btn btn-outline" type="button" data-open="${p.id}">לראות פרטים</button>
            </div>
          </div>
        `;
        grid.appendChild(el);
      });

    const imageSlot = document.getElementById('imageSlot');
    const copyBtn = document.getElementById('copyBtn');
    const requestBtn = document.getElementById('requestBtn');
    const contactBtn = document.getElementById('contactBtn');

    let current = null;

    function openProduct(id){
      const p = products.find(x => x.id === id);
      if(!p) return;
      current = p;
      modalName.textContent = p.name;
      modalDesc.textContent = p.short;
      modalPrice.textContent = "מחיר: " + p.price;

modalIncludes.innerHTML = p.includes
  .map(x => escapeHtml(x))
  .join(" • ");
      modalTags.innerHTML = p.tags.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join("");

      const imagePanel = document.getElementById('imagePanel');
      const modalBody = document.querySelector('.modal-body');
      
      if(p.image){
        imageSlot.innerHTML = `<img alt="דוגמא למוצר" src="${p.image}" style="width:100%;height:100%;object-fit:cover;border-radius:18px;">`;
        imagePanel.classList.remove('hidden');
        modalBody.classList.add('has-image');
      }else{
        imagePanel.classList.add('hidden');
        modalBody.classList.remove('has-image');
      }

      backdrop.classList.add('show');
      document.body.style.overflow = "hidden";
    }

    function close(){
      backdrop.classList.remove('show');
      document.body.style.overflow = "";
      current = null;
    }

    document.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-open]');
      if(btn){
        openProduct(btn.dataset.open);
        return;
      }
      if(e.target === backdrop) close();
    });

    closeModal.addEventListener('click', close);
    document.addEventListener('keydown', (e) => {
      if(e.key === "Escape" && backdrop.classList.contains('show')) close();
    });

    copyBtn.addEventListener('click', copyText);
    copyBtn.addEventListener('keydown', (e) => { if(e.key === 'Enter' || e.key === ' ') { e.preventDefault(); copyText(); } });

    async function copyText(){
      if(!current) return;
      const text =
`${current.name}\n\n${current.short}\n\nמה מקבלים בפועל:\n- ${current.includes.join("\n- ")}\n\nמחיר: ${current.price}`;
      try{
        await navigator.clipboard.writeText(text);
        const orig = copyBtn.textContent;
        copyBtn.textContent = "הועתק ✅";
        setTimeout(()=> copyBtn.textContent = orig, 1200);

        alert("לא הצלחתי להעתיק. אפשר לסמן ולהעתיק ידנית.");

          interestSend.textContent = 'נשלח ✅';
          setTimeout(()=>{ interestSend.textContent = 'שלח'; closeInterest(); close(); }, 1200);

      finally{ interestSend.disabled = false; }

    contactBtn.addEventListener('click', openContact);
    contactClose.addEventListener('click', closeContact);
    contactCancel.addEventListener('click', closeContact);
    contactBackdrop.addEventListener('click', (e)=>{ if(e.target === contactBackdrop) closeContact(); });
    document.addEventListener('keydown', (e)=>{ if(e.key === 'Escape' && contactBackdrop.classList.contains('show')) closeContact(); });

      if(!msg){ alert('אנא כתוב הודעה קצרה'); contactMessage.focus(); return; }

      contactSend.disabled = true; contactSend.textContent = 'שולח...';

          body: JSON.stringify({ id: 'contact', name: `פנייה מהאתר — ${name}`, short: msg, price: '', customerEmail: email })
        });
        if(res.ok){
          contactSend.textContent = 'נשלח ✅';

          const txt = await res.text();
          alert('שגיאה בשליחת המייל: ' + txt);

        alert('שגיאה ברשת. נסו שוב.');

      }finally{ contactSend.disabled = false; }
    });

    // Search wiring
    const searchInput = document.getElementById('searchInput');
    let searchTimer = null;
    function applyFilter(){
      const q = (searchInput && searchInput.value) ? searchInput.value.trim() : '';
      if(!q) return render(products);
      const low = q.toLowerCase();
      const filtered = products.filter(p => (
        p.name.toLowerCase().includes(low) ||
        p.short.toLowerCase().includes(low) ||
        p.tags.some(tag => tag.toLowerCase().includes(low))
      ));
      render(filtered, q);
    }
    if(searchInput){
      searchInput.addEventListener('input', (e)=>{
        clearTimeout(searchTimer);
        searchTimer = setTimeout(applyFilter, 220);
      });
    }

    // initial render
    render(products);

    // Utils
    function escapeHtml(s){
      return String(s).replace(/[&<>"']/g, (m) => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
      }[m]));
    }
