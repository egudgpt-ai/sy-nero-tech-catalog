<title>סינרו · הדגמה חיה של המערכת</title>
<style>
  :root{
    --brand:#4f46e5; --brand-500:#6366f1; --brand-700:#4338ca;
    --brand-50:#eef2ff; --brand-100:#e0e7ff;
    --emerald:#10b981; --emerald-50:#ecfdf5;
    --rose:#ef4444; --rose-50:#fef2f2;
    --amber:#f59e0b; --cyan:#06b6d4;
    --app-bg:#f6f7fb; --card:#fff; --line:#e7e9f1;
    --ink:#0f172a; --muted:#64748b; --muted2:#97a1b4;
    --font:"Assistant","Rubik",system-ui,-apple-system,"Segoe UI","Arial Hebrew","Noto Sans Hebrew",sans-serif;

    /* player shell — theme aware */
    --backdrop: radial-gradient(1200px 700px at 80% -10%, #e0e7ff 0%, transparent 55%),
                radial-gradient(1000px 600px at 10% 110%, #dbeafe 0%, transparent 55%),
                linear-gradient(135deg,#eef2ff 0%,#f8fafc 45%,#eef2ff 100%);
    --shell-ink:#0f172a; --shell-muted:#5b6577;
    --panel:rgba(255,255,255,.72); --panel-line:rgba(15,23,42,.08);
    --ctrl:#fff; --ctrl-line:#e2e8f0; --ctrl-ink:#334155;
    --dot:#c7cede; --dot-on:var(--brand);
    --frame-line:#dfe3ec;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --backdrop: radial-gradient(1200px 700px at 80% -10%, #1e1b4b 0%, transparent 55%),
                  radial-gradient(1000px 600px at 10% 110%, #0b213f 0%, transparent 55%),
                  linear-gradient(135deg,#0b1020 0%,#0e1526 45%,#141034 100%);
      --shell-ink:#eef2ff; --shell-muted:#a9b2c6;
      --panel:rgba(17,24,39,.6); --panel-line:rgba(255,255,255,.10);
      --ctrl:rgba(30,41,59,.7); --ctrl-line:rgba(255,255,255,.12); --ctrl-ink:#e2e8f0;
      --dot:#3a4257; --dot-on:var(--brand-500);
      --frame-line:#20283c;
    }
  }
  :root[data-theme="light"]{
    --backdrop: radial-gradient(1200px 700px at 80% -10%, #e0e7ff 0%, transparent 55%),
                radial-gradient(1000px 600px at 10% 110%, #dbeafe 0%, transparent 55%),
                linear-gradient(135deg,#eef2ff 0%,#f8fafc 45%,#eef2ff 100%);
    --shell-ink:#0f172a; --shell-muted:#5b6577;
    --panel:rgba(255,255,255,.72); --panel-line:rgba(15,23,42,.08);
    --ctrl:#fff; --ctrl-line:#e2e8f0; --ctrl-ink:#334155; --dot:#c7cede; --dot-on:var(--brand);
    --frame-line:#dfe3ec;
  }
  :root[data-theme="dark"]{
    --backdrop: radial-gradient(1200px 700px at 80% -10%, #1e1b4b 0%, transparent 55%),
                radial-gradient(1000px 600px at 10% 110%, #0b213f 0%, transparent 55%),
                linear-gradient(135deg,#0b1020 0%,#0e1526 45%,#141034 100%);
    --shell-ink:#eef2ff; --shell-muted:#a9b2c6;
    --panel:rgba(17,24,39,.6); --panel-line:rgba(255,255,255,.10);
    --ctrl:rgba(30,41,59,.7); --ctrl-line:rgba(255,255,255,.12); --ctrl-ink:#e2e8f0;
    --dot:#3a4257; --dot-on:var(--brand-500); --frame-line:#20283c;
  }

  *{box-sizing:border-box}
  .wrap{
    direction:rtl; min-height:100vh; margin:0; font-family:var(--font);
    background:var(--backdrop); background-attachment:fixed;
    color:var(--shell-ink); display:flex; flex-direction:column; align-items:center;
    padding:22px 16px 30px; gap:14px;
  }
  .topbar{width:100%; max-width:1120px; display:flex; align-items:center; justify-content:space-between; gap:12px}
  .brand{display:flex; align-items:center; gap:10px}
  .brand .mk{width:34px;height:34px;border-radius:10px;background:var(--brand);color:#fff;font-weight:800;
    display:grid;place-items:center;font-size:18px;box-shadow:0 6px 16px rgba(79,70,229,.35)}
  .brand b{font-size:17px;font-weight:800;letter-spacing:-.2px}
  .brand small{display:block;font-size:10.5px;color:var(--shell-muted);margin-top:-3px;letter-spacing:.3px}
  .tag{font-size:12px;color:var(--shell-muted);border:1px solid var(--panel-line);
    background:var(--panel);padding:6px 12px;border-radius:999px;font-weight:600}

  .player{width:100%;max-width:1120px}
  .progress{display:flex;gap:5px;margin-bottom:12px}
  .progress .seg{flex:1;height:4px;border-radius:999px;background:var(--dot);overflow:hidden;position:relative;cursor:pointer}
  .progress .seg i{position:absolute;inset:0;background:var(--dot-on);transform-origin:right center;transform:scaleX(0)}
  .progress .seg.done i{transform:scaleX(1)}
  .progress .seg.active i{transform:scaleX(var(--p,0))}

  .stage-wrap{position:relative;width:100%;border-radius:16px}
  .stage{position:absolute;top:0;right:0;width:1040px;height:648px;transform-origin:top right;
    border-radius:16px;overflow:hidden;background:#fff;
    box-shadow:0 30px 70px -25px rgba(15,23,42,.5), 0 0 0 1px var(--frame-line);}
  /* browser chrome */
  .chrome{height:44px;background:#f1f3f8;border-bottom:1px solid #e4e7ef;display:flex;align-items:center;gap:14px;padding:0 16px}
  .lights{display:flex;gap:7px}
  .lights i{width:12px;height:12px;border-radius:50%}
  .lights i:nth-child(1){background:#f87171}.lights i:nth-child(2){background:#fbbf24}.lights i:nth-child(3){background:#34d399}
  .addr{flex:1;height:26px;background:#fff;border:1px solid #e4e7ef;border-radius:8px;display:flex;align-items:center;
    padding:0 12px;gap:8px;color:#64748b;font-size:12px;direction:ltr;justify-content:flex-start}
  .addr svg{flex:none}
  .screen{position:absolute;inset:44px 0 0 0;background:var(--app-bg);color:var(--ink);overflow:hidden}
  .screen.fade{opacity:0}
  .screen,.screen.show{transition:opacity .28s ease}

  /* simulated cursor */
  .cursor{position:absolute;z-index:40;width:22px;height:22px;pointer-events:none;
    transition:transform .8s cubic-bezier(.4,0,.2,1),opacity .3s;opacity:0;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
  .cursor.click::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--brand);
    animation:ring .5s ease-out}
  @keyframes ring{from{transform:scale(.3);opacity:.9}to{transform:scale(1.6);opacity:0}}

  /* caption */
  .caption{margin-top:16px;background:var(--panel);border:1px solid var(--panel-line);backdrop-filter:blur(10px);
    border-radius:14px;padding:14px 18px;display:flex;gap:14px;align-items:flex-start;min-height:76px}
  .caption .num{flex:none;width:30px;height:30px;border-radius:9px;background:var(--brand);color:#fff;font-weight:800;
    display:grid;place-items:center;font-size:14px;font-variant-numeric:tabular-nums}
  .caption h3{margin:0 0 3px;font-size:16px;font-weight:800;letter-spacing:-.2px;text-wrap:balance}
  .caption p{margin:0;font-size:13.5px;line-height:1.5;color:var(--shell-muted);max-width:80ch}

  .controls{margin-top:12px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
  .btn{border:1px solid var(--ctrl-line);background:var(--ctrl);color:var(--ctrl-ink);border-radius:11px;
    padding:9px 14px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;
    align-items:center;gap:7px;transition:transform .08s, box-shadow .15s, background .15s}
  .btn:hover{transform:translateY(-1px)}
  .btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  .btn.play{background:var(--brand);border-color:var(--brand);color:#fff;padding:9px 20px;
    box-shadow:0 8px 18px -6px rgba(79,70,229,.6)}
  .btn svg{display:block}
  .hint{width:100%;text-align:center;color:var(--shell-muted);font-size:11.5px;margin-top:2px}

  /* ================= app mock components ================= */
  .app{display:flex;height:100%;font-size:13px}
  .side{width:186px;flex:none;background:#fff;border-left:1px solid #eef0f5;display:flex;flex-direction:column;padding:14px 10px}
  .side .lg{display:flex;align-items:center;gap:9px;padding:6px 8px 14px}
  .side .lg .mk{width:32px;height:32px;border-radius:9px;background:var(--brand);color:#fff;font-weight:800;display:grid;place-items:center}
  .side .lg b{font-weight:800}.side .lg small{display:block;font-size:9.5px;color:var(--muted2);margin-top:-2px}
  .nav{display:flex;flex-direction:column;gap:3px;margin-top:4px}
  .nav a{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:10px;color:var(--muted);font-weight:700;font-size:12.5px}
  .nav a.on{background:var(--brand-50);color:var(--brand-700)}
  .main{flex:1;padding:20px 22px;overflow:hidden}
  .h1{font-size:20px;font-weight:800;letter-spacing:-.3px;margin:0 0 3px}
  .sub{color:var(--muted);font-size:12.5px;margin:0 0 16px}
  .grid6{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
  .tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;position:relative;overflow:hidden}
  .tile::before{content:"";position:absolute;top:0;bottom:0;right:0;width:4px;background:var(--brand)}
  .tile.em::before{background:var(--emerald)} .tile.cy::before{background:var(--cyan)}
  .tile.am::before{background:var(--amber)} .tile.ro::before{background:var(--rose)} .tile.sl::before{background:#94a3b8}
  .tile .l{font-size:10.5px;color:var(--muted);font-weight:600}
  .tile .v{font-size:20px;font-weight:800;margin-top:3px;letter-spacing:-.4px;direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
  .tile .s{font-size:10px;color:var(--muted2);margin-top:1px}
  .card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}
  .row{display:flex;gap:14px}
  .ins{border:1px solid;border-radius:12px;padding:11px 13px}
  .ins.g{background:var(--emerald-50);border-color:#bbf7d0}
  .ins.b{background:var(--rose-50);border-color:#fecaca}
  .ins.n{background:#f8fafc;border-color:#e2e8f0}
  .ins b{font-size:12.5px;color:#1e293b} .ins p{margin:3px 0 0;font-size:11.5px;color:#475569;line-height:1.45}
  .badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700}
  .b-br{background:var(--brand-100);color:var(--brand-700)} .b-cy{background:#cffafe;color:#0e7490}
  .b-gr{background:#d1fae5;color:#047857} .b-sl{background:#eef1f6;color:#64748b}
  .b-am{background:#fef3c7;color:#b45309}
  .barlist{display:flex;flex-direction:column;gap:11px}
  .bar .t{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px}
  .bar .t b{color:#334155;font-weight:700} .bar .t span{color:#64748b;direction:ltr;font-variant-numeric:tabular-nums}
  .track{height:9px;border-radius:999px;background:#eef1f6;overflow:hidden}
  .track i{display:block;height:100%;border-radius:999px}
  .btn-pri{background:var(--brand);color:#fff;border:none;border-radius:11px;padding:9px 14px;font-weight:700;font-size:12.5px;font-family:inherit}
  .btn-gh{background:#eef1f6;color:#334155;border:none;border-radius:11px;padding:9px 14px;font-weight:700;font-size:12.5px;font-family:inherit}
  .btn-dn{background:var(--rose-50);color:#dc2626;border:none;border-radius:11px;padding:9px 14px;font-weight:700;font-size:12.5px;font-family:inherit}
  .field{margin-bottom:11px}
  .field label{display:block;font-size:11.5px;color:#475569;font-weight:600;margin-bottom:5px}
  .input{width:100%;border:1px solid #cbd2e0;border-radius:10px;background:#fff;padding:9px 11px;font-size:12.5px;color:#334155;font-family:inherit}
  .input.ph{color:#9aa4b6}
  .modal-bg{position:absolute;inset:0;background:rgba(15,23,42,.42);backdrop-filter:blur(2px);display:flex;justify-content:center;padding-top:34px}
  .modal{width:560px;max-width:92%;background:#fff;border-radius:18px;box-shadow:0 30px 60px -20px rgba(2,6,23,.5);padding:20px;max-height:560px;overflow:hidden}
  .modal h3{margin:0 0 14px;font-size:16px;font-weight:800}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .note{border:1px solid #e2e8f0;background:#f8fafc;border-radius:12px;padding:11px;font-size:11.5px;color:#475569}
  .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;background:#fff;border:1px solid #e2e8f0;border-radius:6px;padding:3px 7px;direction:ltr;display:inline-block;margin-top:5px;color:#334155}
  .kv{font-size:11px;color:#64748b;margin-top:2px}.kv b{color:#475569}
  .tbl{width:100%;border-collapse:collapse;font-size:11.5px}
  .tbl th{color:#94a3b8;font-weight:600;text-align:right;padding:6px 4px;border-bottom:1px solid #e8ebf2;font-size:10.5px}
  .tbl td{padding:7px 4px;border-bottom:1px solid #f1f3f8;color:#475569;direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
  .tbl td.rt{direction:rtl}

  /* cover / outro */
  .cover{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;
    background:radial-gradient(900px 500px at 50% -10%,#e0e7ff,transparent 60%),linear-gradient(160deg,#f8fafc,#eef2ff)}
  .cover .mk{width:74px;height:74px;border-radius:20px;background:var(--brand);color:#fff;font-weight:800;font-size:38px;
    display:grid;place-items:center;box-shadow:0 20px 40px -12px rgba(79,70,229,.6)}
  .cover h2{margin:6px 0 0;font-size:34px;font-weight:800;letter-spacing:-.6px}
  .cover p{margin:0;color:#64748b;font-size:15px;max-width:44ch;line-height:1.55}
  .pill{margin-top:6px;background:#fff;border:1px solid #e2e8f0;border-radius:999px;padding:8px 16px;font-size:12.5px;color:#475569;font-weight:700}
  .feat{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:640px;max-width:90%;margin-top:6px;text-align:right}
  .feat div{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px 14px;font-size:12.5px;color:#334155;display:flex;gap:9px;align-items:flex-start}
  .feat b{font-weight:800}

  @media (max-width:560px){
    .caption p{font-size:12.5px}.caption h3{font-size:14.5px}
    .btn span.lbl{display:none}.btn.play span.lbl{display:inline}
  }
  @media (prefers-reduced-motion:reduce){
    .screen,.cursor,.progress .seg i{transition:none !important}
    .cursor.click::after{animation:none}
  }
</style>

<div class="wrap">
  <div class="topbar">
    <div class="brand"><span class="mk">S</span><div><b>סינרו</b><small>Synero Marketing</small></div></div>
    <span class="tag">🎬 הדגמה חיה של המערכת</span>
  </div>

  <div class="player">
    <div class="progress" id="progress"></div>
    <div class="stage-wrap" id="stageWrap">
      <div class="stage" id="stage">
        <div class="chrome">
          <div class="lights"><i></i><i></i><i></i></div>
          <div class="addr" id="addr"></div>
        </div>
        <div class="screen show" id="screen"></div>
        <svg class="cursor" id="cursor" viewBox="0 0 24 24" fill="#1e293b"><path d="M4 2l6.5 16 2.3-6.7L19.5 8.9 4 2z" stroke="#fff" stroke-width="1.4"/></svg>
      </div>
    </div>

    <div class="caption">
      <div class="num" id="capNum">1</div>
      <div><h3 id="capTitle"></h3><p id="capText"></p></div>
    </div>

    <div class="controls">
      <button class="btn" id="prev" aria-label="הקודם">⟩ הקודם</button>
      <button class="btn play" id="play"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" id="playIco"><path d="M8 5v14l11-7z"/></svg><span class="lbl" id="playLbl">הפעל</span></button>
      <button class="btn" id="next" aria-label="הבא">הבא ⟨</button>
      <button class="btn" id="restart" aria-label="התחל מחדש">↻ מהתחלה</button>
      <div class="hint">אפשר לנווט עם החצים במקלדת · לחיצה על הפסים למעלה קופצת למסך</div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var reduce = matchMedia("(prefers-reduced-motion:reduce)").matches;

  // ---------- reusable mock builders ----------
  function side(active){
    var items=[["דאשבורד פילוחים","📈"],["הקמפיינים שלי","🎯"],["לקוחות","🤝"],["הגדרות","⚙️"]];
    return '<div class="side"><div class="lg"><span class="mk">S</span><div><b>סינרו</b><small>Synero Marketing</small></div></div><div class="nav">'+
      items.map(function(it){return '<a class="'+(it[0]===active?'on':'')+'"><span>'+it[1]+'</span>'+it[0]+'</a>';}).join('')+
      '</div></div>';
  }
  function tile(l,v,cls,s){return '<div class="tile '+(cls||'')+'"><div class="l">'+l+'</div><div class="v">'+v+'</div>'+(s?'<div class="s">'+s+'</div>':'')+'</div>';}
  function ins(t,txt,cls){return '<div class="ins '+cls+'"><b>'+t+'</b><p>'+txt+'</p></div>';}
  function bar(label,val,pct,col,note){return '<div class="bar"><div class="t"><b>'+label+'</b><span>'+val+(note?' · '+note:'')+'</span></div><div class="track"><i style="width:'+pct+'%;background:'+col+'"></i></div></div>';}

  function trendSVG(){
    var sp=[8,26,60,52,40,20,34,58,44,30,50,46,40,44]; // spend-ish (low)
    var rv=[34,58,72,66,54,30,44,68,58,42,64,60,52,58]; // revenue (high)
    var W=920,H=190,pad=8,n=rv.length, step=(W-pad*2)/(n-1);
    function pts(a){return a.map(function(y,i){return [pad+i*step, H-8-(y/80)*(H-24)];});}
    function path(p){var d="M"+p[0][0]+","+p[0][1];for(var i=1;i<p.length;i++){var x0=p[i-1][0],y0=p[i-1][1],x1=p[i][0],y1=p[i][1],mx=(x0+x1)/2;d+=" C"+mx+","+y0+" "+mx+","+y1+" "+x1+","+y1;}return d;}
    function area(p){return path(p)+" L"+p[n-1][0]+","+(H-8)+" L"+p[0][0]+","+(H-8)+" Z";}
    var P1=pts(sp),P2=pts(rv);
    return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="190" preserveAspectRatio="none">'+
      '<defs><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#10b981" stop-opacity=".28"/><stop offset="1" stop-color="#10b981" stop-opacity="0"/></linearGradient>'+
      '<linearGradient id="gs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6366f1" stop-opacity=".22"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></linearGradient></defs>'+
      [0,1,2,3].map(function(i){var y=8+i*((H-16)/3);return '<line x1="0" x2="'+W+'" y1="'+y+'" y2="'+y+'" stroke="#eef2f7"/>';}).join('')+
      '<path d="'+area(P2)+'" fill="url(#gr)"/><path d="'+path(P2)+'" fill="none" stroke="#10b981" stroke-width="2.4"/>'+
      '<path d="'+area(P1)+'" fill="url(#gs)"/><path d="'+path(P1)+'" fill="none" stroke="#6366f1" stroke-width="2.4"/>'+
      '</svg>';
  }

  function clientCard(company,person,tagHtml,link,extra){
    return '<div class="card" style="padding:15px">'+
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">'+
      '<div><div style="font-size:15px;font-weight:800">'+company+'</div><div style="font-size:11.5px;color:#64748b">'+person+'</div></div>'+tagHtml+'</div>'+
      (extra||'')+
      '<div style="margin-top:12px"><div style="font-size:10.5px;color:#64748b;margin-bottom:5px">הקישור האישי של הלקוח</div>'+
      '<div style="display:flex;gap:7px"><div class="input ph" style="direction:ltr;font-size:10.5px;flex:1;overflow:hidden;white-space:nowrap">'+link+'</div><button class="btn-gh" style="padding:8px 11px">העתקה</button></div></div></div>';
  }

  // ---------- scenes ----------
  var scenes = [
    { addr:"synero.co.il", num:"◆", title:"סינרו · מערכת למדידת קמפיינים שיווקיים",
      text:"סיור קצר במערכת: ניהול קמפיינים, מדידת ביצועים, פורטל אישי לכל לקוח ודאשבורד תובנות. הסרטון מתקדם לבד — אפשר לעצור ולנווט בכל רגע.",
      html:'<div class="cover"><span class="mk">S</span><h2>סינרו</h2><p>מערכת למדידה ולניהול של קמפיינים שיווקיים — שלך ושל הלקוחות שלך, במקום אחד.</p><span class="pill">▶ ההדגמה מתחילה…</span></div>' },

    addr.innerHTML=lock+'<span>'+s.addr+'</span>';
    capNum.textContent=s.num; capTitle.textContent=s.title; capText.textContent=s.text;
    segEls.forEach(function(el,j){el.classList.toggle('done',j<i);el.classList.toggle('active',j===i);el.style.setProperty('--p',0);});
    // swap with fade
    screen.classList.add('fade');
    setTimeout(function(){
      screen.innerHTML=s.html; screen.classList.remove('fade');
      cursor.classList.remove('click'); cursor.style.opacity=0;
      if(s.cursor && !reduce){
        cursor.style.transform='translate('+(s.cursor[0]-40)+'px,'+(s.cursor[1]-30)+'px)';
        setTimeout(function(){cursor.style.opacity=1;cursor.style.transform='translate('+s.cursor[0]+'px,'+s.cursor[1]+'px)';},260);
        setTimeout(function(){cursor.classList.add('click');},1300);
      }
    }, reduce?0:170);
  }

  function go(i,manual){
    idx=(i+scenes.length)%scenes.length; render(idx); t0=performance.now();
    if(manual && playing){/*keep playing*/}
  }
  function tick(now){
    if(!playing) return;
    var el=segEls[idx].querySelector('i'); var p=Math.min(1,(now-t0)/DUR);
    segEls[idx].style.setProperty('--p',p);
    if(p>=1){ if(idx===scenes.length-1){pause();return;} go(idx+1);}
    raf=requestAnimationFrame(tick);
  }
  function play(){ if(idx===scenes.length-1) idx=0, render(0); playing=true; t0=performance.now()-((segEls[idx].__p||0)*DUR);
    playIco.innerHTML='<rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/>'; playLbl.textContent='עצור';
    cancelAnimationFrame(raf); raf=requestAnimationFrame(tick);}
  function pause(){ playing=false; playIco.innerHTML='<path d="M8 5v14l11-7z"/>'; playLbl.textContent='הפעל'; cancelAnimationFrame(raf);}

  playBtn.addEventListener('click',function(){playing?pause():play();});
  document.getElementById('next').addEventListener('click',function(){go(idx+1,true);t0=performance.now();});
  document.getElementById('prev').addEventListener('click',function(){go(idx-1,true);t0=performance.now();});
  document.getElementById('restart').addEventListener('click',function(){go(0,true);t0=performance.now();if(!playing)play();});
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowLeft'){go(idx+1,true);t0=performance.now();}      // RTL: left = next
    else if(e.key==='ArrowRight'){go(idx-1,true);t0=performance.now();}
    else if(e.key===' '){e.preventDefault();playing?pause():play();}
  });

  fit(); render(0);
  setTimeout(function(){ if(!reduce) play(); }, 900);
})();
</script>
