<title>סינרו — כך זה נראה ללקוח</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  /* צילומי מסך אמיתיים מהמערכת. העמוד מחויב לעולם חזותי כהה אחד — הרקע נלקח
     מגווני המותג עצמם כדי שהמסגרת לא תתחרה בצילום שבתוכה. */
  :root {
    --ink:       #1a1d2e;
    --ink-soft:  #4a5068;
    --ink-faint: #767ea6;
    --void:      #f5f6fa;
    --line:      rgba(26, 29, 46, .12);
    --primary:   #477dbf;
    --accent:    #69bdbc;
    --font: "Heebo", "Assistant", "Segoe UI", system-ui, Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--void);
    color: var(--ink);
    font-family: var(--font);
    direction: rtl;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 22px 16px 28px;
  }

  .masthead {
    width: min(1080px, 100%);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
  }

  .brand {
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .22em;
    color: var(--accent);
  }

  .masthead h1 {
    margin: 2px 0 0;
    font-size: clamp(19px, 2.5vw, 27px);
    font-weight: 800;
    text-wrap: balance;
  }

  .masthead p {
    margin: 0;
    color: var(--ink-faint);
    font-size: 13px;
  }

  /* ── הבמה ─────────────────────────────────────────────────────── */
  .stage {
    width: min(1080px, 100%);
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--line);
    background: #e8eaf2;
    box-shadow: 0 26px 70px rgba(0, 0, 0, .12);
    aspect-ratio: 1180 / 820;
  }

  .frame {
    margin: 0;
    position: absolute;
    inset: 0;
    opacity: 0;
    visibility: hidden;
    transition: opacity .55s ease, visibility .55s;
  }

  .frame[data-active="true"] { opacity: 1; visibility: visible; }

  .frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* ── כתוביות ──────────────────────────────────────────────────── */
  .caption {
    width: min(1080px, 100%);
    min-height: 60px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .caption .kicker {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .18em;
    color: var(--accent);
  }

  .caption h2 {
    margin: 0;
    font-size: clamp(16px, 2vw, 20px);
    font-weight: 800;
  }

  .caption p {
    margin: 0;
    font-size: clamp(13px, 1.6vw, 15px);
    line-height: 1.55;
    color: var(--ink-soft);
    max-width: 68ch;
    text-wrap: pretty;
  }

  /* ── פקדים ────────────────────────────────────────────────────── */
  .controls {
    width: min(1080px, 100%);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .play {
    all: unset;
    cursor: pointer;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid var(--line);
    display: grid;
    place-items: center;
    font-size: 12px;
    flex: none;
  }

  .play:hover, .chapter:hover { border-color: var(--accent); }
  .play:focus-visible, .chapter:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .chapters { display: flex; gap: 6px; flex: 1; flex-wrap: wrap; }

  .chapter {
    all: unset;
    cursor: pointer;
    flex: 1 1 110px;
    min-width: 110px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 4px 2px;
  }

  .chapter .idx {
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .12em;
    color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
  }

  .chapter .name { font-size: 11px; color: var(--ink-faint); }

  .chapter[data-on="true"] .idx,
  .chapter[data-on="true"] .name { color: var(--ink); }

  .chapter .track {
    height: 2px;
    border-radius: 999px;
    background: var(--line);
    overflow: hidden;
  }

  .chapter .track i {
    display: block;
    height: 100%;
    width: 0;
    background: var(--accent);
  }

  .chapter[data-done="true"] .track i { width: 100%; }

  .foot {
    width: min(1080px, 100%);
    font-size: 11px;
    line-height: 1.6;
    color: var(--ink-faint);
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: .001ms !important; }
  }
</style>

  <div>

<p class="foot">
  הצילומים נלקחו ממסך ההקלטה של המערכת. שם הלקוח בהדגמה לדוגמה בלבד.
</p>

<script>
  const SCENES = [{"name": "פותחים הקלטה", "ms": 4600, "line": "המסך היחיד שהלקוח רואה: שם לקוח, סוג פגישה, וכפתור אחד. בלי תפריטים ובלי הגדרות."}, {"name": "ממלאים את הפרטים", "ms": 4600, "line": "מזינים את שם הלקוח ובוחרים את סוג הפגישה. אפשר גם לצרף קישור ל-Google Meet ולסמן הקלטת שמע מהמחשב."}, {"name": "מקליטים", "ms": 6000, "line": "טיימר עגול מציג את הזמן שנותר, גל הקול מאשר שהמיקרופון קולט, וההקלטה נשלחת לתמלול ברקע תוך כדי."}, {"name": "המערכת מתמללת", "ms": 4600, "line": "בלחיצה על «סיום הקלטה» המערכת מתמללת ומפיקה את הסיכום לבד — בלי שהלקוח עושה דבר."}, {"name": "המסמך מוכן", "ms": 6500, "line": "מסמך הסיכום מוכן להורדה — PDF לצפייה, או Word לעריכה."}];

  const frames   = [...document.querySelectorAll('.frame')];
  const chapters = document.getElementById('chapters');
  const playBtn  = document.getElementById('play');
  const capK = document.getElementById('capK');
  const capT = document.getElementById('capT');
  const capL = document.getElementById('capL');

  let current = 0, playing = true, advance = null;

  SCENES.forEach((s, i) => {
    const b = document.createElement('button');
    b.className = 'chapter';
    b.type = 'button';
    b.innerHTML = '<span class="idx">' + String(i + 1).padStart(2, '0') + '</span>' +
                  '<span class="track"><i></i></span>' +
                  '<span class="name"></span>';
    b.querySelector('.name').textContent = s.name;
    b.addEventListener('click', () => go(i));
    chapters.appendChild(b);
  });

  const chapterEls = [...chapters.children];

  function show(i) {
    current = i;
    frames.forEach((f, k) => { f.dataset.active = String(k === i); });
    capK.textContent = 'שלב ' + (i + 1) + ' מתוך ' + SCENES.length;
    capT.textContent = SCENES[i].name;
    capL.textContent = SCENES[i].line;
    chapterEls.forEach((el, k) => {
      el.dataset.on = String(k === i);
      el.dataset.done = String(k <= i);
    });
  }

  function schedule() {
    clearTimeout(advance);
    if (!playing) return;
    advance = setTimeout(() => { show((current + 1) % SCENES.length); schedule(); }, SCENES[current].ms);
  }

  function go(i) { show(i); schedule(); }

  playBtn.addEventListener('click', () => {
    playing = !playing;
    playBtn.innerHTML = playing ? '&#10074;&#10074;' : '&#9658;';
    playBtn.setAttribute('aria-label', playing ? 'השהה' : 'נגן');
    if (playing) schedule(); else clearTimeout(advance);
  });

  show(0);
  schedule();
</script>
