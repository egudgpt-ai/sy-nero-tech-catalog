<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SYNERO TECH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f7fa;
  --surface:#ffffff;
  --surface2:#eef1f6;
  --ink:#0d1020;
  --muted:#5a6478;
  --fog:#8a94a8;
  --accent:#00b89c;
  --accent-l:#00f5d4;
  --accent-bg:rgba(0,184,156,.07);
  --accent-border:rgba(0,184,156,.18);
  --line:#e2e6ef;
  --maxw:1100px;
  --shadow-sm:0 2px 12px rgba(0,0,0,.06);
  --shadow-md:0 8px 40px rgba(0,0,0,.09);
  --shadow-lg:0 24px 80px rgba(0,0,0,.13);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--ink);
  font-family:"Heebo","Assistant",system-ui,Arial,sans-serif;
  font-size:16px;line-height:1.65;overflow-x:hidden;
}

/* ── ANIMATIONS ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(32px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideRight{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideLeft{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(0,184,156,.25)}50%{box-shadow:0 0 0 14px rgba(0,184,156,0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes countUp{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}

.anim-up{opacity:0;animation:fadeUp .7s cubic-bezier(.22,1,.36,1) forwards}
.anim-in{opacity:0;animation:fadeIn .6s ease forwards}
.anim-right{opacity:0;animation:slideRight .7s cubic-bezier(.22,1,.36,1) forwards}
.anim-left{opacity:0;animation:slideLeft .7s cubic-bezier(.22,1,.36,1) forwards}
.anim-scale{opacity:0;animation:scaleIn .65s cubic-bezier(.22,1,.36,1) forwards}
.delay-1{animation-delay:.1s}.delay-2{animation-delay:.2s}.delay-3{animation-delay:.3s}
.delay-4{animation-delay:.45s}.delay-5{animation-delay:.6s}.delay-6{animation-delay:.75s}

/* scroll-reveal: JS adds .revealed class */
.reveal{opacity:0;transform:translateY(28px);transition:opacity .65s cubic-bezier(.22,1,.36,1),transform .65s cubic-bezier(.22,1,.36,1)}
.reveal.revealed{opacity:1;transform:translateY(0)}
.reveal-scale{opacity:0;transform:scale(.94);transition:opacity .65s cubic-bezier(.22,1,.36,1),transform .65s cubic-bezier(.22,1,.36,1)}
.reveal-scale.revealed{opacity:1;transform:scale(1)}
.reveal-right{opacity:0;transform:translateX(-32px);transition:opacity .65s cubic-bezier(.22,1,.36,1),transform .65s cubic-bezier(.22,1,.36,1)}
.reveal-right.revealed{opacity:1;transform:translateX(0)}
.reveal-left{opacity:0;transform:translateX(32px);transition:opacity .65s cubic-bezier(.22,1,.36,1),transform .65s cubic-bezier(.22,1,.36,1)}
.reveal-left.revealed{opacity:1;transform:translateX(0)}

/* ── NAV ── */
.nav{
  position:sticky;top:0;z-index:200;
  background:rgba(255,255,255,.88);backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);
  animation:fadeIn .4s ease;
}
.nav-inner{
  max-width:var(--maxw);margin:0 auto;
  padding:0 40px;height:64px;
  display:flex;align-items:center;justify-content:space-between;
}
.nav-logo img{height:28px;width:auto;display:block}
.nav-back{
  display:inline-flex;align-items:center;gap:8px;
  font-size:13px;font-weight:700;color:var(--muted);
  text-decoration:none;letter-spacing:.3px;
  padding:8px 14px;border-radius:8px;
  transition:background .2s,color .2s;
}
.nav-back:hover{background:var(--surface2);color:var(--ink)}
.nav-back::before{content:'→';font-size:14px;color:var(--accent)}

/* ── HERO ── */
.hero{
  position:relative;overflow:hidden;
  background:linear-gradient(135deg,#f0f8f6 0%,#f5f7fa 50%,#eef3ff 100%);
  border-bottom:1px solid var(--line);
  padding:80px 40px 70px;
}
.hero-blob{
  position:absolute;width:600px;height:600px;border-radius:50%;
  background:radial-gradient(circle,rgba(0,184,156,.12) 0%,transparent 70%);
  top:-200px;left:-150px;pointer-events:none;
  animation:float 8s ease-in-out infinite;
}
.hero-blob2{
  position:absolute;width:400px;height:400px;border-radius:50%;
  background:radial-gradient(circle,rgba(99,102,241,.08) 0%,transparent 70%);
  bottom:-100px;right:-100px;pointer-events:none;
  animation:float 10s ease-in-out infinite reverse;
}
.hero-inner{max-width:var(--maxw);margin:0 auto;position:relative}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  font-size:10px;font-weight:800;letter-spacing:4px;text-transform:uppercase;
  color:var(--accent);font-family:monospace;margin-bottom:20px;
  background:var(--accent-bg);border:1px solid var(--accent-border);
  border-radius:100px;padding:6px 14px;
}
.eyebrow::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite}
.product-name{
  font-size:clamp(30px,4.5vw,52px);font-weight:900;line-height:1.12;
  letter-spacing:-.5px;color:var(--ink);margin-bottom:20px;
  max-width:700px;text-wrap:balance;
}
.product-name .accent-word{color:var(--accent)}
.product-short{
  font-size:clamp(15px,1.5vw,18px);color:var(--muted);
  max-width:580px;line-height:1.8;margin-bottom:32px;
}
.hero-meta{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:0}
.price-chip{
  display:inline-flex;align-items:center;gap:8px;
  background:#fff;border:1.5px solid var(--accent-border);
  border-radius:100px;padding:10px 20px;
  font-size:14px;font-weight:800;color:var(--accent);
  box-shadow:0 4px 20px rgba(0,184,156,.12);
}
.tag-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:32px}
.tag{
  font-size:11px;font-weight:700;padding:5px 13px;border-radius:100px;
  background:#fff;border:1px solid var(--line);color:var(--muted);
  box-shadow:var(--shadow-sm);
}

/* ── DEMO ── */
.demo-section{
  padding:64px 40px;
  background:var(--ink);
  position:relative;overflow:hidden;
}
.demo-section::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(0,245,212,.06),transparent 70%);
}
.demo-inner{max-width:var(--maxw);margin:0 auto;position:relative}
.demo-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.demo-label{
  font-size:10px;font-weight:800;letter-spacing:4px;text-transform:uppercase;
  color:#00c9ae;font-family:monospace;
  display:inline-flex;align-items:center;gap:8px;
}
.demo-label::before{content:'●';animation:pulse 2s infinite;color:#00f5d4}
.demo-link{
  font-size:12px;font-weight:700;color:#8a94a8;
  text-decoration:none;letter-spacing:.5px;
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 14px;border:1px solid rgba(255,255,255,.08);border-radius:8px;
  transition:color .2s,border-color .2s;
}
.demo-link:hover{color:#fff;border-color:rgba(255,255,255,.2)}
.demo-frame-wrap{
  width:100%;border-radius:20px;overflow:hidden;
  border:1px solid rgba(255,255,255,.07);
  box-shadow:0 32px 100px -20px rgba(0,0,0,.7);
  position:relative;background:#060913;
  height:500px;
  transform:translateY(0);transition:transform .5s cubic-bezier(.22,1,.36,1),box-shadow .5s;
}
.demo-frame-wrap:hover{transform:translateY(-4px);box-shadow:0 40px 120px -20px rgba(0,0,0,.75)}
.demo-frame-wrap iframe{
  position:absolute;top:0;left:0;
  width:1300px;height:702px;border:0;
  transform-origin:top left;display:block;
}

/* ── CONTENT ── */
.content-section{padding:80px 40px;max-width:var(--maxw);margin:0 auto}

/* ── INFO BOXES ── */
.info-boxes{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:56px}
@media(max-width:540px){.info-boxes{grid-template-columns:1fr}}
.info-box{
  background:var(--surface);border:1.5px solid var(--line);border-radius:16px;
  padding:24px 26px;
  box-shadow:var(--shadow-sm);
  transition:transform .3s,box-shadow .3s,border-color .3s;
  cursor:default;
}
.info-box:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:var(--accent-border)}
.info-box-icon{font-size:24px;margin-bottom:10px;display:block}
.info-box-label{
  font-size:9px;font-weight:800;letter-spacing:3px;text-transform:uppercase;
  color:var(--accent);font-family:monospace;margin-bottom:8px;display:block;
}
.info-box p{font-size:14px;color:var(--muted);line-height:1.65}

/* ── TWO COL ── */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:64px;align-items:start}
@media(max-width:720px){.two-col{grid-template-columns:1fr}}
.section-title{
  font-size:22px;font-weight:800;color:var(--ink);
  margin-bottom:28px;line-height:1.3;
  display:flex;align-items:center;gap:10px;
}
.section-title::before{
  content:'';display:inline-block;width:4px;height:22px;
  background:var(--accent);border-radius:4px;flex-shrink:0;
}
.long-text{font-size:15px;color:var(--muted);line-height:1.9;white-space:pre-wrap}

/* ── INCLUDES ── */
.includes-list{list-style:none;display:flex;flex-direction:column;gap:0}
.includes-list li{
  display:flex;align-items:flex-start;gap:14px;
  font-size:14px;color:var(--muted);line-height:1.6;
  padding:14px 0;border-bottom:1px solid var(--line);
  transition:color .2s,background .2s;
}
.includes-list li:first-child{border-top:1px solid var(--line)}
.includes-list li:hover{color:var(--ink)}
.includes-list li .check{
  width:22px;height:22px;border-radius:50%;
  background:var(--accent-bg);border:1.5px solid var(--accent-border);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;margin-top:1px;font-size:11px;color:var(--accent);font-weight:800;
  transition:background .3s,transform .3s;
}
.includes-list li:hover .check{background:var(--accent);color:#fff;transform:scale(1.1)}

/* ── DIVIDER ── */
.divider{height:1px;background:var(--line);max-width:var(--maxw);margin:0 auto}

/* ── CTA ── */
.cta-section{
  padding:96px 40px;text-align:center;
  background:linear-gradient(135deg,#f0f8f6 0%,#f5f7fa 60%,#eef3ff 100%);
  border-top:1px solid var(--line);position:relative;overflow:hidden;
}
.cta-section::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 60% 80% at 50% 50%,rgba(0,184,156,.06),transparent 70%);
}
.cta-inner{position:relative;max-width:560px;margin:0 auto}
.cta-tag{
  display:inline-block;font-size:10px;font-weight:800;letter-spacing:3px;text-transform:uppercase;
  color:var(--accent);font-family:monospace;margin-bottom:18px;
}
.cta-title{font-size:clamp(24px,3vw,36px);font-weight:900;color:var(--ink);margin-bottom:14px;text-wrap:balance}
.cta-sub{font-size:16px;color:var(--muted);margin-bottom:40px;line-height:1.7}
.btn-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.btn-primary{
  display:inline-flex;align-items:center;gap:10px;
  background:var(--accent);color:#fff;
  font-size:15px;font-weight:800;padding:16px 36px;
  border-radius:14px;border:none;cursor:pointer;
  font-family:inherit;text-decoration:none;
  transition:transform .25s,box-shadow .25s,background .2s;
  box-shadow:0 8px 30px rgba(0,184,156,.32);
  letter-spacing:.2px;
}
.btn-primary:hover{transform:translateY(-3px);box-shadow:0 14px 40px rgba(0,184,156,.42);background:#00c9ae}
.btn-primary:active{transform:translateY(0)}
.btn-secondary{
  display:inline-flex;align-items:center;gap:10px;
  background:var(--surface);color:var(--ink);
  font-size:15px;font-weight:700;padding:16px 32px;
  border-radius:14px;border:1.5px solid var(--line);cursor:pointer;
  font-family:inherit;text-decoration:none;
  transition:transform .25s,box-shadow .25s,border-color .2s;
  box-shadow:var(--shadow-sm);
}
.btn-secondary:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--accent-border)}

/* ── FOOTER ── */
.footer{
  padding:28px 40px;border-top:1px solid var(--line);
  max-width:var(--maxw);margin:0 auto;
  display:flex;align-items:center;justify-content:space-between;
  font-size:12px;color:var(--fog);
}
.footer img{height:20px;display:block}

/* ── FLOATING ELEMENTS ── */
.hero-deco{
  position:absolute;top:40px;left:40px;
  display:flex;flex-direction:column;gap:10px;
  pointer-events:none;
}
.deco-dot{
  width:8px;height:8px;border-radius:50%;background:var(--accent);opacity:.3;
  animation:float 4s ease-in-out infinite;
}
.deco-dot:nth-child(2){animation-delay:.5s;opacity:.2}
.deco-dot:nth-child(3){animation-delay:1s;opacity:.15}

/* ── MODAL ── */
.modal-backdrop{
  display:none;position:fixed;inset:0;z-index:300;
  background:rgba(13,16,32,.6);backdrop-filter:blur(10px);
  align-items:center;justify-content:center;
  animation:fadeIn .2s ease;
}
.modal-backdrop.open{display:flex}
.modal-box{
  background:#fff;border:1px solid var(--line);border-radius:24px;
  padding:44px;max-width:480px;width:calc(100% - 32px);
  position:relative;box-shadow:var(--shadow-lg);
  animation:scaleIn .3s cubic-bezier(.22,1,.36,1);
}
.modal-close{
  position:absolute;top:20px;left:20px;
  width:34px;height:34px;border-radius:50%;
  border:1.5px solid var(--line);background:transparent;
  color:var(--fog);font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .2s,color .2s,border-color .2s;
}
.modal-close:hover{background:var(--surface2);color:var(--ink);border-color:var(--accent-border)}
.modal-title{font-size:22px;font-weight:900;color:var(--ink);margin-bottom:6px}
.modal-sub{font-size:14px;color:var(--muted);margin-bottom:28px;line-height:1.6}
.form-group{margin-bottom:18px}
.form-label{font-size:11px;font-weight:800;letter-spacing:.5px;color:var(--muted);display:block;margin-bottom:7px;text-transform:uppercase}
.form-input{
  width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;
  color:var(--ink);font-size:15px;font-family:inherit;
  padding:12px 16px;transition:border-color .2s,box-shadow .2s;outline:none;
}
.form-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.form-btn{
  width:100%;background:var(--accent);color:#fff;
  font-size:15px;font-weight:800;border:none;border-radius:12px;
  padding:15px;cursor:pointer;font-family:inherit;margin-top:8px;
  transition:background .2s,transform .2s,box-shadow .2s;
  box-shadow:0 4px 18px rgba(0,184,156,.28);
}
.form-btn:hover{background:#00c9ae;transform:translateY(-1px);box-shadow:0 8px 28px rgba(0,184,156,.36)}
.form-msg{font-size:13px;text-align:center;margin-top:14px;color:var(--accent);min-height:20px;font-weight:600}

/* ── SCROLL PROGRESS ── */
.scroll-bar{
  position:fixed;top:0;right:0;left:0;z-index:201;
  height:3px;background:linear-gradient(to left,var(--accent-l),var(--accent));
  transform-origin:right;transform:scaleX(0);transition:transform .1s;
}

@media(max-width:600px){
  .hero{padding:60px 20px 50px}
  .content-section{padding:60px 20px}
  .cta-section{padding:64px 20px}
  .nav-inner,.footer{padding:0 20px}
  .demo-section{padding:48px 20px}
}
</style>
</head>
<body>

<div class="scroll-bar" id="scrollBar"></div>

<!-- NAV -->
<nav class="nav">
  <div class="nav-inner">
    <a href="/" class="nav-logo"><img src="/assets/logo.png" alt="SYNERO TECH"></a>
    <a href="/#products" class="nav-back">כל השירותים</a>
  </div>
</nav>

<!-- HERO -->
<section class="hero">
  <div class="hero-blob"></div>
  <div class="hero-blob2"></div>
  <div class="hero-deco">
    <div class="deco-dot"></div>
    <div class="deco-dot"></div>
    <div class="deco-dot"></div>
  </div>
  <div class="hero-inner">
    <span class="eyebrow anim-in" id="pCat">PRODUCT</span>
    <h1 class="product-name anim-up delay-1" id="pName">טוען…</h1>
    <p class="product-short anim-up delay-2" id="pShort"></p>
    <div class="tag-row anim-up delay-3" id="pTags"></div>
    <div class="hero-meta anim-up delay-4"></div>
  </div>
</section>

<!-- DEMO -->
<div class="demo-section" id="demoSection" style="display:none">
  <div class="demo-inner">
    <div class="demo-header reveal">
      <span class="demo-label">הדגמה חיה</span>
      <a class="demo-link" id="demoFullLink" href="#" target="_blank">פתח בחלון מלא ↗</a>
    </div>
    <div class="demo-frame-wrap reveal-scale" id="demoWrap">
      <iframe id="demoIframe" loading="eager" tabindex="-1"></iframe>
    </div>
  </div>
</div>

<!-- CONTENT -->
<section class="content-section">
  <div class="info-boxes reveal" id="pInfoBoxes" style="display:none">
    <div class="info-box">
      <span class="info-box-icon">🎯</span>
      <span class="info-box-label">מתאים ל</span>
      <p id="pFit"></p>
    </div>
    <div class="info-box">
      <span class="info-box-icon">📈</span>
      <span class="info-box-label">מה תרוויחו</span>
      <p id="pRoi"></p>
    </div>
  </div>

  <div class="two-col">
    <div class="reveal-right">
      <h2 class="section-title">על המוצר</h2>
      <p class="long-text" id="pLong"></p>
    </div>
    <div class="reveal-left">
      <h2 class="section-title">מה כלול</h2>
      <ul class="includes-list" id="pIncludes"></ul>
    </div>
  </div>
</section>

<div class="divider"></div>

<!-- CTA -->
<div class="cta-section">
  <div class="cta-inner reveal">
    <span class="cta-tag">מוכנים?</span>
    <h2 class="cta-title">בואו נבנה את זה יחד</h2>
    <p class="cta-sub" id="ctaSub">נשמח לענות על כל שאלה ולהתאים את הפתרון הנכון לעסק שלכם.</p>
    <div class="btn-row">
      <a href="/#products" class="btn-secondary">חזרה לשירותים</a>
      <button class="btn-primary" id="ctaBtn">אני מעוניין/ת ←</button>
    </div>
  </div>
</div>

<!-- FOOTER -->
<div class="footer">
  <img src="/assets/logo.png" alt="SYNERO TECH">
  <span>© 2025 SYNERO TECH</span>
</div>

<!-- MODAL -->
<div class="modal-backdrop" id="modal">
  <div class="modal-box">
    <button class="modal-close" id="modalClose">×</button>
    <div class="modal-title">אשמח לשמוע עוד 👋</div>
    <div class="modal-sub" id="modalSub"></div>
    <div class="form-group">
      <label class="form-label" for="iName">שם מלא</label>
      <input class="form-input" id="iName" type="text" placeholder="ישראל ישראלי">
    </div>
    <div class="form-group">
      <label class="form-label" for="iEmail">אימייל</label>
      <input class="form-input" id="iEmail" type="email" placeholder="you@example.com">
    </div>
    <div class="form-group">
      <label class="form-label" for="iPhone">טלפון (אופציונלי)</label>
      <input class="form-input" id="iPhone" type="tel" placeholder="05X-XXXXXXX">
    </div>
    <button class="form-btn" id="iSend">שליחה</button>
    <div class="form-msg" id="iMsg"></div>
  </div>
</div>

<script>
(function(){
  /* ── scroll progress bar ── */
  const bar = document.getElementById('scrollBar');
  window.addEventListener('scroll', ()=>{
    const p = window.scrollY / (document.body.scrollHeight - window.innerHeight);
    bar.style.transform = 'scaleX(' + Math.min(p,1) + ')';
  }, {passive:true});

  /* ── scroll reveal ── */
  const revealEls = document.querySelectorAll('.reveal,.reveal-scale,.reveal-right,.reveal-left');
  const ro = new IntersectionObserver(entries=>{
    entries.forEach(e=>{
